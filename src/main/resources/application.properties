spring.application.name=group-chat-search

# Server config
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chat_db
spring.datasource.username=chat_user
spring.datasource.password=chat_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize database using schema.sql
spring.sql.init.mode=always

# JPA / Hibernate Configuration
# Disable auto-ddl because we strictly use schema.sql for the pgvector extension
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
