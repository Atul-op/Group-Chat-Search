version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-chat-db
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector-chat-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgvector-chat-data: